<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>音游模拟器 3D</title>
<script src="jsmediatags.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{width:100%;height:100%;overflow:hidden;background:#0f0f1a}
body{width:100%;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f0f1a;color:#e0e0f0}

.menu{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:100;background:#0f0f1a}
.menu-top{text-align:center;padding:8px 12px 4px;flex-shrink:0}
.menu-top h1{font-size:22px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,#667eea,#e74c3c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline}
.menu-top p{color:rgba(255,255,255,0.3);font-size:11px;display:inline;margin-left:8px}
.menu-body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.menu-center{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}

.mode-select{display:flex;gap:6px}
.mode-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);padding:8px 20px;border-radius:40px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:1px;transition:all .2s;white-space:nowrap}
.mode-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(102,126,234,0.3)}
.custom-inputs{display:none;gap:8px;flex-wrap:wrap;justify-content:center}
.custom-inputs.show{display:flex}
.custom-inputs .ig{display:flex;flex-direction:column;align-items:center;gap:2px}
.custom-inputs label{font-size:10px;color:rgba(255,255,255,0.35)}
.custom-inputs input{width:80px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 8px;color:#fff;font-size:15px;font-weight:700;text-align:center;outline:none}
.custom-inputs input:focus{border-color:#667eea}
.custom-inputs .hint{font-size:10px;color:rgba(255,255,255,0.2)}

.start-btn{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:14px 48px;border-radius:60px;font-size:17px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .25s;box-shadow:0 8px 28px rgba(102,126,234,0.35)}
.start-btn:active{transform:scale(.95)}
.best{color:#f39c12;font-size:13px;letter-spacing:1px}
.action-row{display:flex;gap:8px;margin-top:4px}
.action-row .mode-btn{font-size:12px;padding:7px 16px}
.status-line{font-size:10px;color:rgba(255,255,255,0.2);text-align:center;min-height:14px}

/* Floating dialog */
.float-overlay{display:none;position:absolute;inset:0;z-index:200;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;touch-action:auto}
.float-overlay.show{display:flex}
.float-box{background:rgba(20,20,40,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:20px 24px 56px 24px;max-width:340px;width:85%;max-height:70vh;overflow:hidden;position:relative}
.float-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:8px;text-align:center}
.float-list{overflow-y:scroll;-webkit-overflow-scrolling:touch;max-height:calc(70vh - 120px);touch-action:pan-y}
.float-cancel{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);padding:8px 32px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);border-radius:10px;font-size:14px;cursor:pointer;white-space:nowrap}
.float-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.float-item:active{background:rgba(102,126,234,0.18);border-color:rgba(102,126,234,0.35)}
.float-item .fi-icon{font-size:20px;flex-shrink:0}
.float-item .fi-info{flex:1;min-width:0}
.float-item .fi-name{font-size:14px;font-weight:600;color:#e0e0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.float-item .fi-meta{font-size:11px;color:rgba(255,255,255,0.3)}
.float-empty{color:rgba(255,255,255,0.15);font-size:13px;text-align:center;padding:20px}
.float-hint{font-size:11px;color:rgba(255,255,255,0.25);text-align:center;margin:10px 0}
.float-cancel{display:block;width:100%;padding:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);border-radius:10px;font-size:14px;cursor:pointer;margin-top:8px}

.game-area{position:absolute;inset:0;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
.game-area.active{display:block}
#mainCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}

.hud{position:absolute;top:8px;left:8px;padding:6px 10px;background:rgba(0,0,0,0.7);border-radius:10px;border:1px solid rgba(255,255,255,0.06);z-index:20;font-size:11px;color:rgba(255,255,255,0.45);display:none;flex-direction:column;gap:3px;min-width:80px;pointer-events:none}
.hud.show{display:flex}
.hud .hr{display:flex;justify-content:space-between;gap:10px}
.hud strong{font-weight:700;color:#fff;font-size:12px}
#musicInfo{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);border-radius:10px;border:1px solid rgba(255,255,255,0.06);padding:6px 10px;z-index:20;pointer-events:none;display:none;flex-direction:column;align-items:center;gap:4px;min-width:70px}
#musicCover{font-size:24px;line-height:1}
#musicTitle{font-size:10px;color:rgba(255,255,255,0.5)}
#progressWrap{width:100%;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
#progressFill{height:100%;width:0;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:2px;transition:width .1s linear}
#pauseBtn{position:absolute;top:6px;left:6px;z-index:26;width:30px;height:30px;border-radius:6px;background:#000;border:none;color:#fff;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;outline:none;-webkit-tap-highlight-color:transparent}
#pauseBtn b{font-weight:700;font-size:12px}
#pauseDialog,#recDialog{display:none;position:absolute;inset:0;z-index:50;background:rgba(0,0,0,0.7);justify-content:center;align-items:center}
#pauseDialog .box,#recDialog .box{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:28px 32px;text-align:center;max-width:280px;width:80%}
#pauseDialog .box .title{font-size:20px;font-weight:700;margin-bottom:4px;color:#fff}
#pauseDialog .box .sub{font-size:13px;color:rgba(255,255,255,0.35);margin-bottom:16px}
#pauseDialog .box .btn,#recDialog .box .btn{display:block;width:100%;margin:6px 0;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#fff;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:1px}
#pauseDialog .box .btn.primary{background:#667eea;border-color:transparent}
#recDialog .box .btn.primary{background:#e74c3c;border-color:transparent}
#recDialog .box p{margin:10px 0 16px;font-size:14px;color:rgba(255,255,255,0.5)}

#settingsDialog{display:none;position:absolute;inset:0;z-index:110;background:rgba(0,0,0,0.75);justify-content:center;align-items:center}
#settingsDialog.show{display:flex}
#settingsDialog .box{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:28px 32px;text-align:center;max-width:320px;width:80%}
#settingsDialog .box .title{font-size:20px;font-weight:700;margin-bottom:12px;color:#fff}
#settingsDialog .box .row-label{font-size:13px;color:rgba(255,255,255,0.4);text-align:left;margin:14px 0 6px}
#settingsDialog .box .slider-row{display:flex;align-items:center;gap:8px}
#settingsDialog .box .slider-row span{font-size:12px;color:rgba(255,255,255,0.3)}
#settingsDialog .box input[type=range]{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;outline:none}
#settingsDialog .box .val{font-size:18px;font-weight:700;color:#fff;min-width:42px;text-align:center}
#settingsDialog .box .btn{display:block;width:100%;margin:6px 0;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#settingsDialog .box .btn.primary{background:#667eea;border-color:transparent}

.center-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;pointer-events:none;z-index:15;text-align:center}
#comboHUD{position:absolute;top:15%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:700;color:rgba(255,255,255,0.2);pointer-events:none;z-index:15;text-align:center;display:none}
#comboHUD.show{display:block}
#comboHUD.bump{transform:translateX(-50%) scale(1.3);color:rgba(255,255,255,0.45)}
.judge-line{position:absolute;height:2px;z-index:4;pointer-events:none}
.result-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.75);z-index:100;justify-content:center;align-items:center}
.result-overlay.show{display:flex}
.result-box{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:28px;padding:36px 40px;text-align:center;max-width:380px;width:88%}
.result-box .big-num{font-size:48px;font-weight:800;color:#2ecc71}
.result-box .stat-row{display:flex;justify-content:center;gap:32px;margin:18px 0}
.result-box .stat-item .num{font-size:28px;font-weight:800}
.result-box .stat-item .label{font-size:12px;color:rgba(255,255,255,0.35);margin-top:2px}
.result-box .comment{margin:14px 0 18px;font-size:18px;letter-spacing:1px}
.result-box .btn{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:14px 44px;border-radius:40px;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:1px;transition:all .25s;margin:4px}
.result-box .btn-plain{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);padding:10px 32px;font-size:14px}
#chartOverlay{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;text-align:center;pointer-events:none}
#chartOverlay div:first-child{font-size:36px;font-weight:800;color:#e74c3c;text-shadow:0 0 20px rgba(231,76,60,0.5)}
#chartOverlay div:last-child{font-size:12px;color:rgba(255,255,255,0.3);margin-top:4px}
</style></head><body>

<!-- menu -->
<div class="menu" id="menu">
<div class="menu-top"><h1>音游模拟器 3D</h1><p>Canvas高性能版</p></div>
<div class="menu-body"><div class="menu-center">
<div class="mode-select"><button class="mode-btn active" data-mode="progressive">渐进</button><button class="mode-btn" data-mode="custom">自定义</button></div>
<div class="custom-inputs" id="customInputs">
<div class="ig"><label>每秒方块数</label><input type="number" id="inputRate" value="3" min="0.5" step="0.5"></div>
<div class="ig"><label>BPM</label><input type="number" id="inputBpm" value="180" min="30" step="5"></div>
<div class="hint">修改任一自动换算</div>
</div>
<button class="mode-btn" id="settingsBtn">设置</button>
<button class="start-btn" id="startBtn">开始挑战</button>
<div class="best" id="bestDisplay">-</div>
<div class="action-row">
<button class="mode-btn" id="chartMakeBtn">作谱</button>
<button class="mode-btn" id="importBtn">导入</button>
<button class="mode-btn" id="playBtn">演奏</button>
<button class="mode-btn" id="manageBtn">管理</button>
</div>
<div class="status-line" id="statusLine">就绪</div>
</div></div>
</div>

<!-- floating picker -->
<div class="float-overlay" id="pickerOverlay">
<div class="float-box">
<div class="float-title" id="pickerTitle">选择歌曲</div>
<div class="float-list" id="pickerList"></div>
<div class="float-hint" id="pickerHint"></div>
<button class="float-cancel" id="pickerCancel">取消</button>
</div>
</div>

<!-- game area -->
<div class="game-area" id="gameArea">
<canvas id="mainCanvas"></canvas>
<div class="hud" id="hud"><div class="hr"><span></span><strong id="hudScore">0</strong></div><div class="hr"><span></span><strong id="hudRate">0</strong><span style="color:rgba(255,255,255,0.25);font-size:10px">/s</span></div><div class="hr"><span></span><strong id="hudTarget" style="color:#667eea;font-size:12px">0</strong><span style="color:rgba(255,255,255,0.25);font-size:10px">/s</span></div><div class="hr"><span></span><strong id="hudMiss" style="color:#e74c3c">0/5</strong></div></div>
<div id="musicInfo"><div id="musicCover"></div><div id="musicTitle"></div><div id="progressWrap"><div id="progressFill"></div></div></div>
<button id="pauseBtn"><b>|</b><b>|</b></button>
<div id="pauseDialog"><div class="box"><div class="title">已暂停</div><div class="sub" id="pauseSub"></div><button class="btn primary" id="pauseResumeBtn">继续</button><button class="btn" id="pauseExitBtn">返回</button></div></div>
<div id="recDialog"><div class="box"><div id="recDialogCount" style="font-size:24px;font-weight:800;color:#e74c3c"> REC</div><p id="recDialogMsg"></p><button class="btn primary" id="recContinueBtn">继续录制</button><button class="btn" id="recSaveBtn">保存并退出</button><button class="btn" id="recDiscardBtn">丢弃</button></div></div>
<div id="chartOverlay"><div> REC</div><div>敲击 S D J K</div></div>
<div class="judge-line" id="judgeLine"></div>
<div class="center-msg" id="centerMsg"></div>
<div id="comboHUD">0</div>
<div class="result-overlay" id="resultOverlay"><div class="result-box">
<div class="big-num" id="resultRate">0</div><div style="font-size:13px;color:rgba(255,255,255,0.3)">/s</div>
<div class="stat-row"><div class="stat-item"><div class="num" id="resultPerfect" style="color:#2ecc71">0</div><div class="label">PERFECT</div></div><div class="stat-item"><div class="num" id="resultGood" style="color:#f39c12">0</div><div class="label">GOOD</div></div><div class="stat-item"><div class="num" id="resultLate" style="color:#3498db">0</div><div class="label">LATE</div></div></div>
<div class="stat-row" style="gap:16px"><div class="stat-item"><div class="num" id="resultScore" style="color:#3498db">0</div><div class="label">总点击</div></div><div class="stat-item"><div class="num" id="resultTime" style="color:#f39c12">0</div><div class="label">存活秒数</div></div><div class="stat-item"><div class="num" id="resultMaxCombo" style="color:#e67e22">0</div><div class="label">MAX COMBO</div></div></div>
<div class="comment" id="resultComment"></div>
<button class="btn" id="restartBtn">再来一次</button>
<button class="btn btn-plain" id="backBtn">返回菜单</button>
</div></div>
</div>

<div id="settingsDialog">
<div class="box"><div class="title">设置</div>
<div class="row-label">下落速度</div><div class="slider-row"><span>0.5</span><input type="range" id="speedSlider" min="0.5" max="6" step="0.1" value="1"><span>6.0</span><span class="val" id="settingsSpeed">1.0</span></div>
<div class="row-label">节拍器音量</div><input type="range" id="metronomeVolSlider" min="0" max="100" value="80">
<div class="row-label">按键音量</div><input type="range" id="keySoundVolSlider" min="0" max="100" value="80">
<button class="btn primary" id="settingsCloseBtn" style="margin-top:18px">关闭</button></div></div>

<script>
/* ═══════════════════════════════════════════════════
   Native Bridge
   ═══════════════════════════════════════════════════ */
var IS_NATIVE=typeof window.FileBridge!=='undefined';
var mp3Files=[],jsonFiles=[],chartMp3Url=null,chartMp3Blob=null,chartMp3Name='',chartNotes=[];
var pickerMode='',pickerSong=null;

function esc(s){var d=document.createElement('span');d.textContent=s;return d.innerHTML}
function b64ToBlob(b64,m){var r=atob(b64),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return new Blob([a],{type:m})}
function fileToBase64(f){return new Promise(function(rs,rj){var r=new FileReader();r.onload=function(){rs(r.result.split(',')[1])};r.onerror=rj;r.readAsDataURL(f)})}
function fileToText(f){return new Promise(function(rs,rj){var r=new FileReader();r.onload=function(){rs(r.result)};r.onerror=rj;r.readAsText(f)})}

/* ── Library ── */
async function scanLib(){
  if(!IS_NATIVE)return;
  mp3Files=JSON.parse(FileBridge.listMp3s());
  var all=JSON.parse(FileBridge.listJsons());jsonFiles=[];
  for(var i=0;i<all.length;i++){if(parseInt(FileBridge.getJsonNoteCount(all[i]))>0)jsonFiles.push(all[i])}
  document.getElementById('statusLine').textContent=mp3Files.length+' 歌曲, '+jsonFiles.length+' 谱面';
}
function getSongName(fn){return fn.replace(/\.mp3$/i,'')}
function getChartName(fn){return fn.replace(/\.json$/i,'')}

/* ── Floating picker ── */
function showPicker(mode,txt,hint,items,fnIcon,fnLabel,fnMeta,onPick){
  pickerMode=mode;
  document.getElementById('pickerTitle').textContent=txt;
  document.getElementById('pickerHint').textContent=hint||'';
  var list=document.getElementById('pickerList');
  list.innerHTML='';
  if(!items.length){list.innerHTML='<div class="float-empty">没有可用的文件<br>请先导入</div>';}
  for(var i=0;i<items.length;i++){
    (function(it){
      var div=document.createElement('div');div.className='float-item';
      div.innerHTML='<div class="fi-icon">'+fnIcon(it)+'</div><div class="fi-info"><div class="fi-name">'+esc(fnLabel(it))+'</div><div class="fi-meta">'+fnMeta(it)+'</div></div>';
      div.addEventListener('click',function(e){e.preventDefault();onPick(it)});
      list.appendChild(div);
    })(items[i]);
  }
  document.getElementById('pickerOverlay').classList.add('show');
}
function closePicker(){var el=document.getElementById('pickerOverlay');el.style.opacity='0';el.style.pointerEvents='none';setTimeout(function(){el.classList.remove('show');el.style.opacity='';el.style.pointerEvents=''},250)}

function pickAndPlaySong(songFn){
  chartMp3Blob=null;chartMp3Name=getSongName(songFn);
  chartMp3Url=FileBridge.getFileUri(songFn);
  document.getElementById('statusLine').textContent=': '+chartMp3Name;
  tryLoadCover(songFn);
  // now pick chart
  showPicker('chart','选择谱面','',
    jsonFiles,
    function(fn){return ''},
    function(fn){return getChartName(fn)},
    function(fn){var n=FileBridge.getJsonNoteCount(fn);return parseInt(n)||0},
    function(fn){pickChartAndPlay(fn)});
}
function pickChartAndPlay(chartFn){
  var raw=FileBridge.readFileText(chartFn);
  if(raw){try{var d=JSON.parse(raw);chartNotes=d&&d.notes?d.notes:[]}catch(e){chartNotes=[]}}
  if(!chartNotes.length){document.getElementById('statusLine').textContent='';closePicker();return}
  document.getElementById('statusLine').textContent=': '+chartMp3Name+' + '+getChartName(chartFn)+' ('+chartNotes.length+')';
  closePicker();
  startChartPlayback();
}
function pickSongForRecord(songFn){
  chartMp3Blob=null;chartMp3Name=getSongName(songFn);
  chartMp3Url=FileBridge.getFileUri(songFn);
  document.getElementById('statusLine').textContent='REC: '+chartMp3Name;
  tryLoadCover(songFn);
  closePicker();
  startChartRecording();
}

function showPlayPicker(){
  if(!mp3Files.length){document.getElementById('statusLine').textContent='';return}
  showPicker('play','选择歌曲','',
    mp3Files,
    function(fn){return ''},
    function(fn){return getSongName(fn)},
    function(fn){return fn},
    function(fn){pickAndPlaySong(fn)});
}
function showRecordPicker(){
  if(!mp3Files.length){document.getElementById('statusLine').textContent='';return}
  showPicker('record','选择录制歌曲','选一首歌来做谱',
    mp3Files,
    function(fn){return ''},
    function(fn){return getSongName(fn)},
    function(fn){return fn},
    function(fn){pickSongForRecord(fn)});
}

function tryLoadCover(songFn){
  if(typeof jsmediatags==='undefined')return;
  try{
    var uri=FileBridge.getFileUri(songFn);
    fetch(uri).then(function(r){return r.blob()}).then(function(blob){
      jsmediatags.read(blob,{onSuccess:function(tag){var pic=tag.tags&&tag.tags.picture;if(pic&&pic.data){var b=new Uint8Array(pic.data.length);for(var i=0;i<pic.data.length;i++)b[i]=pic.data.charCodeAt(i);document.getElementById('musicCover').innerHTML='<img src="'+URL.createObjectURL(new Blob([b],{type:pic.format}))+'" style="width:28px;height:28px;border-radius:4px;object-fit:cover">'}},onError:function(){}});
    }).catch(function(){});
  }catch(e){}
}

/* ── Import ── */
async function doImport(file){
  if(!IS_NATIVE||!file)return;
  var status=document.getElementById('statusLine');
  var ext=file.name.split('.').pop().toLowerCase();
  status.textContent=''+file.name+' ...';
  try{
    if(ext==='mp3'){
      var b64=await fileToBase64(file);
      status.textContent=' ...';
      FileBridge.writeFileBase64(file.name,b64);
    }else{
      var text=await fileToText(file);
      status.textContent=' ...';
      FileBridge.writeFileText(file.name,text);
    }
    status.textContent='';
    await scanLib();
    status.textContent=' '+file.name;
    if(ext==='mp3'&&!jsonFiles.length) status.textContent+=' ()';

function updateBlocks(p,noMissCount,dt,elapsed){
  var th=noMissCount?MISS_RANGE*3:MISS_RANGE;
  for(var l=0;l<LANE_COUNT;l++){
    for(var i=laneBlocks[l].length-1;i>=0;i--){
      var b=laneBlocks[l][i];if(b.judged){laneBlocks[l].splice(i,1);continue}
      b.posY+=FALL_SPEED*scrollSpeed*getScaleAtY(b.posY,p)*dt;
      if(b.duration){
        if(b.posY>p.nearY){b.posY=p.nearY;b.holdHeadPassed=true}
        var rt=elapsed!==undefined?elapsed:performance.now(),t2=elapsed!==undefined?chartTravelTime:calcTravelTime(p);
        var tr=Math.max(0,b.holdTailTime-rt);b.tailPosY=chartSpawnY(tr,p,t2);
        if(b.holdHeadPassed&&tr<=16){
          if(b.holdActive){b.holdActive=false;holdStartTime[l]=null;hitFlashActive[l]=false;triggerLaneFlash(l);showJudge('HOLD','#9b59b6');playHit()}
          activeHolds=Math.max(0,activeHolds-1);
          laneBlocks[l].splice(i,1);
        }
        continue;
      }
      if(b.posY>p.nearY+th){b.judged=true;if(!noMissCount){missCount++;judgeCounts.miss++;document.getElementById('hudMiss').textContent=missCount+'/'+MAX_MISS;playMiss();if(missCount>=MAX_MISS){gameOver();return false}}if(combo>0){if(combo>maxCombo)maxCombo=combo;combo=0;updateComboDisplay()}}

    var best=cands[0],bestD=Infinity;
    for(var ci=0;ci<cands.length;ci++){var c=cands[ci],by=c.posY+(BLOCK_SIZE*getScaleAtY(c.posY,p))/2,d=Math.abs(by-p.nearY);if(d<bestD){bestD=d;best=c}}
    if(!!best.duration){if(bestD>PERFECT_RANGE*1.5){triggerLaneFlash(l);playTap();continue}best.holdActive=true;holdStartTime[l]=performance.now();triggerLaneFlash(l);hitFlashTime[l]=performance.now();hitFlashActive[l]=true;showJudge('HOLD','#9b59b6');playHit();score++;combo++;if(combo>maxCombo)maxCombo=combo;updateComboDisplay();continue}
    var text,color;
    if(bestD<=PERFECT_RANGE){text='PERFECT';color='#2ecc71'}else if(bestD<=GOOD_RANGE){text='GOOD';color='#f39c12'}else if(bestD<=MISS_RANGE){text='LATE';color='#3498db'}else{triggerLaneFlash(l);playTap();continue}
    best.judged=true;best.hitTime=performance.now();triggerLaneFlash(l);hitFlashTime[l]=performance.now();hitFlashActive[l]=true;showJudge(text,color);playHit();
    if(bestD<=PERFECT_RANGE)judgeCounts.perfect++;else if(bestD<=GOOD_RANGE)judgeCounts.good++;else judgeCounts.late++;
    score++;combo++;if(combo>maxCombo)maxCombo=combo;updateComboDisplay();
    var nts=performance.now();hitTimestamps.push(nts);while(hitTimestamps.length>0&&hitTimestamps[0]<nts-3000)hitTimestamps.shift();
    var wr=Math.round(hitTimestamps.length*10/3)/10;if(wr>peakRate)peakRate=wr;
    document.getElementById('hudScore').textContent=score;document.getElementById('hudRate').textContent=wr.toFixed(1);
  }
}

function advanceStage(){if(!running||paused||gameMode!=='progressive')return;currentRate+=RATE_INCREMENT;document.getElementById('hudTarget').textContent=currentRate.toFixed(1);stopMetronome();startMetronome(Math.round(currentRate*60),false);stageTimer=setTimeout(advanceStage,STAGE_DURATION)}

function gameOver(){if(!running)return;lastGameMode='normal';running=false;stopMetronome();if(stageTimer){clearTimeout(stageTimer);stageTimer=null}if(animId){cancelAnimationFrame(animId);animId=null}stopHoldComboTimer();holdStartTime=[null,null,null,null];hitFlashActive=[false,false,false,false];activeHolds=0;laneBlocks=[[],[],[],[]];laneFlashTimers=[-1,-1,-1,-1];judgeTexts=[];drawFrame();var el=(Date.now()-startTime)/1000,sr=peakRate>0?peakRate:(el>0?score/el:0);saveBest(sr);document.getElementById('resultRate').textContent=sr.toFixed(1);document.getElementById('resultScore').textContent=score;document.getElementById('resultTime').textContent=Math.floor(el);document.getElementById('resultPerfect').textContent=judgeCounts.perfect;document.getElementById('resultGood').textContent=judgeCounts.good;document.getElementById('resultLate').textContent=judgeCounts.late;document.getElementById('resultMaxCombo').textContent=maxCombo;document.getElementById('resultComment').textContent=getComment(sr);document.getElementById('resultOverlay').classList.add('show')}

function startGame(){
  initAudio();var mb=document.querySelector('.mode-btn.active');gameMode=mb?mb.dataset.mode:'progressive';currentRate=gameMode==='custom'?Math.max(0.5,parseFloat(document.getElementById('inputRate').value)||1):1.25;

  updateMusicInfo(false);document.getElementById('hud').classList.add('show');document.getElementById('pauseBtn').style.display='flex';
  score=0;missCount=0;running=true;startTime=Date.now();knownTouchIds={};judgeCounts={perfect:0,good:0,late:0,miss:0};hitTimestamps=[];peakRate=0;
  combo=0;maxCombo=0;holdStartTime=[null,null,null,null];hitFlashActive=[false,false,false,false];activeHolds=0;
  document.getElementById('comboHUD').classList.remove('show');lastFrameTime=0;laneBlocks=[[],[],[],[]];laneFlashTimers=[-1,-1,-1,-1];judgeTexts=[];
  ensureCanvas();updateLayout();
  document.getElementById('hudScore').textContent='0';document.getElementById('hudRate').textContent='0';document.getElementById('hudTarget').textContent=currentRate.toFixed(1);document.getElementById('hudMiss').textContent='0/'+MAX_MISS;

function restart(){document.getElementById('resultOverlay').classList.remove('show');if(lastGameMode==='chart'){startChartPlayback();return}startGame()}

function pauseGame(){
  if(paused)return;paused=true;

  if(!running){paused=false;return}
  if(stageTimer){clearTimeout(stageTimer);stageTimer=null}stopMetronome();stopHoldComboTimer();if(animId){cancelAnimationFrame(animId);animId=null}
  if(isChartPlayback&&chartPlayer)chartPlayer.pause();
  document.getElementById('pauseSub').textContent=isChartPlayback?'演奏·自制谱':'练习模式';
  document.getElementById('pauseDialog').style.display='flex';
}

function resumeGame(){
  if(!paused)return;paused=false;
  if(isChartRecording){document.getElementById('recDialog').style.display='none';if(chartPlayer)chartPlayer.play().catch(function(){});return}
  if(isChartPlayback){startHoldComboTimer();if(chartPlayer)chartPlayer.play().catch(function(){});document.getElementById('pauseDialog').style.display='none';if(!animId)animId=requestAnimationFrame(chartPlaybackLoop);return}
  document.getElementById('pauseDialog').style.display='none';if(!animId)animId=requestAnimationFrame(gameLoop);startMetronome(Math.round(currentRate*60),false);
}

function updateLayout(){var p=getPerspectiveParams(),ni=getLaneInfoAtY(p.nearY,p),jl=document.getElementById('judgeLine');jl.style.top=p.nearY+'px';jl.style.left=ni.lanes[0]+'px';jl.style.width=(ni.lanes[LANE_COUNT-1]+ni.laneW-ni.lanes[0])+'px';jl.style.background='rgba(102,126,234,0.3)'}
function calcTravelTime(p){return(p.nearY-p.farY)*Math.log(1/0.09)/(FALL_SPEED*scrollSpeed*0.91)*1000}
function chartSpawnY(t,p,tt){if(t>=tt)return p.farY;if(t<=16)return p.nearY-2;var lr=t/tt*Math.log(1/0.09),sc=Math.max(0.09,Math.exp(-lr));return p.farY+(p.nearY-p.farY)*(sc-0.09)/0.91}
function updateMusicInfo(s,t,pct){var b=document.getElementById('musicInfo');if(s){b.style.display='flex';if(t)document.getElementById('musicTitle').textContent=t;if(pct!==undefined)document.getElementById('progressFill').style.width=Math.min(100,pct)+'%'}else{b.style.display='none'}}

/* ── Chart recording ── */
function startChartRecording(){
  if(!chartMp3Blob&&!chartMp3Url){showRecordPicker();return}
  if(isChartRecording)return;
  recordedNotes=[];holdStartTime=[null,null,null,null];isChartRecording=true;
  document.getElementById('menu').style.display='none';document.getElementById('gameArea').classList.add('active');document.getElementById('resultOverlay').classList.remove('show');document.getElementById('centerMsg').textContent='';
  laneBlocks=[[],[],[],[]];laneFlashTimers=[-1,-1,-1,-1];judgeTexts=[];ensureCanvas();updateLayout();
  document.getElementById('chartOverlay').style.display='block';document.getElementById('pauseBtn').style.display='flex';document.getElementById('recDialog').style.display='none';document.getElementById('hud').classList.add('show');
  updateMusicInfo(true,chartMp3Name,0);document.getElementById('hudScore').textContent='0';document.getElementById('hudRate').textContent='-';document.getElementById('hudTarget').textContent='';document.getElementById('hudMiss').textContent='0/';recordingAnimId=requestAnimationFrame(recordingDrawLoop);
  var url=chartMp3Url||URL.createObjectURL(chartMp3Blob);chartPlayer=new Audio(url);chartPlayer.addEventListener('ended',function(){stopChartRecording(true)});chartPlayer.addEventListener('timeupdate',function(){if(chartPlayer&&chartPlayer.duration)updateMusicInfo(true,null,chartPlayer.currentTime/chartPlayer.duration*100)});chartPlayer.play().catch(function(){});
}

function stopChartRecording(completed){
  if(!isChartRecording)return;isChartRecording=false;if(recordingAnimId){cancelAnimationFrame(recordingAnimId);recordingAnimId=null}
  document.getElementById('pauseBtn').style.display='none';document.getElementById('pauseDialog').style.display='none';document.getElementById('recDialog').style.display='none';
  if(chartPlayer){chartPlayer.pause();chartPlayer=null}document.getElementById('chartOverlay').style.display='none';
  chartNotes=recordedNotes.sort(function(a,b){return a.t-b.t});recordedNotes=[];
  if(chartNotes.length>0&&completed){autoSaveChart();setTimeout(function(){backToMenu()},600)}
  else setTimeout(function(){backToMenu()},300);
}

function recordTap(l){if(!isChartRecording||!chartPlayer)return;holdStartTime[l]=performance.now();var t=chartPlayer.currentTime*1000;recordedNotes.push({t:Math.round(t),l:l})}

/* ── Chart playback ── */
function startChartPlayback(){
  if(!chartMp3Blob&&!chartMp3Url){showPlayPicker();return}if(!chartNotes.length){showPlayPicker();return}
  if(isChartPlayback)endChartPlayback();
  isChartPlayback=true;chartNextIdx=0;gameMode='progressive';var url=chartMp3Url||URL.createObjectURL(chartMp3Blob);
  if(chartPlayer){chartPlayer.pause();chartPlayer=null}chartPlayer=new Audio(url);chartPlayer.preload='auto';chartPlayer.addEventListener('ended',function(){if(isChartPlayback)endChartPlayback()});
  document.getElementById('menu').style.display='none';document.getElementById('gameArea').classList.add('active');document.getElementById('resultOverlay').classList.remove('show');document.getElementById('centerMsg').textContent='';
  score=0;missCount=0;running=true;startTime=Date.now();knownTouchIds={};judgeCounts={perfect:0,good:0,late:0,miss:0};hitTimestamps=[];peakRate=0;combo=0;maxCombo=0;
  holdStartTime=[null,null,null,null];hitFlashActive=[false,false,false,false];activeHolds=0;document.getElementById('comboHUD').classList.remove('show');
  lastFrameTime=0;laneBlocks=[[],[],[],[]];laneFlashTimers=[-1,-1,-1,-1];judgeTexts=[];ensureCanvas();drawFrame();updateLayout();
  document.getElementById('pauseBtn').style.display='flex';updateMusicInfo(true,chartMp3Name,0);
  document.getElementById('hudScore').textContent='0';document.getElementById('hudRate').textContent='0';document.getElementById('hudTarget').textContent='';document.getElementById('hudMiss').textContent='0/';
  var msg=document.getElementById('centerMsg');msg.style.color='#fff';msg.textContent='3';
  setTimeout(function(){msg.textContent='2'},600);setTimeout(function(){msg.textContent='1'},1200);
  setTimeout(function(){msg.textContent='';chartPlayer.play().catch(function(){});startHoldComboTimer();var p=getPerspectiveParams();chartTravelTime=calcTravelTime(p);if(!animId)animId=requestAnimationFrame(chartPlaybackLoop)},1800);
}

function chartPlaybackLoop(){
  if(!isChartPlayback||!chartPlayer){animId=null;return}
  var now=performance.now()/1000;if(!lastFrameTime)lastFrameTime=now;var dt=Math.min(0.1,now-lastFrameTime);lastFrameTime=now;
  var p=getPerspectiveParams();if(chartPlayer.duration)updateMusicInfo(true,null,chartPlayer.currentTime/chartPlayer.duration*100);
  var elapsed=chartPlayer.currentTime*1000;chartTravelTime=calcTravelTime(p);
  while(chartNextIdx<chartNotes.length&&elapsed>=chartNotes[chartNextIdx].t-chartTravelTime){spawnChartBlock(chartNotes[chartNextIdx],elapsed,p);chartNextIdx++}
  if(!updateBlocks(p,true,dt,chartPlayer.currentTime*1000))return;drawFrame();animId=requestAnimationFrame(chartPlaybackLoop);
}

function spawnChartBlock(note,elapsed,p){var rm=Math.max(0,note.t-elapsed),dur=note.d||null;laneBlocks[note.l].push({lane:note.l,posY:chartSpawnY(rm,p,chartTravelTime),hue:Math.floor(Math.random()*360),judged:false,hitTime:null,missTime:null,duration:dur,holdActive:false,holdHeadPassed:false,tailPosY:0,holdTailTime:dur?(note.t+dur):null})}

function endChartPlayback(){
  lastGameMode='chart';isChartPlayback=false;if(chartPlayer){chartPlayer.pause();chartPlayer=null}running=false;stopHoldComboTimer();if(animId){cancelAnimationFrame(animId);animId=null}
  updateMusicInfo(false);laneBlocks=[[],[],[],[]];laneFlashTimers=[-1,-1,-1,-1];judgeTexts=[];drawFrame();
  document.getElementById('resultScore').textContent=score;document.getElementById('resultPerfect').textContent=judgeCounts.perfect;document.getElementById('resultGood').textContent=judgeCounts.good;document.getElementById('resultLate').textContent=judgeCounts.late;document.getElementById('resultMaxCombo').textContent=maxCombo;document.getElementById('resultComment').textContent='';
  document.getElementById('resultRate').style.display='none';document.getElementById('resultTime').parentElement.style.display='none';document.getElementById('resultOverlay').classList.add('show');
}

function handleRelease(l){
  if(isChartRecording&&holdStartTime[l]!==null){var d=performance.now()-holdStartTime[l];if(d>300){for(var i=recordedNotes.length-1;i>=0;i--){if(recordedNotes[i].l===l){recordedNotes[i].d=Math.round(d);break}}}holdStartTime[l]=null}
  if(isChartPlayback&&running){var bl=laneBlocks[l];for(var j=0;j<bl.length;j++){if(bl[j].holdActive&&!bl[j].judged){bl[j].holdActive=false;holdStartTime[l]=null;hitFlashActive[l]=false;break}}holdStartTime[l]=null}
  if(!isChartRecording&&!isChartPlayback){holdStartTime[l]=null;hitFlashActive[l]=false}
}

var knownTouchIds={};document.getElementById('gameArea').addEventListener('touchstart',function(e){if(paused||(!running&&!isChartRecording))return;e.preventDefault();var a=[],p2=getPerspectiveParams();for(var t=0;t<e.touches.length;t++){var id=e.touches[t].identifier;if(!knownTouchIds[id]){knownTouchIds[id]=true;a.push({x:e.touches[t].clientX,y:e.touches[t].clientY})}}if(!a.length)return;if(isChartRecording){var info=getLaneInfoAtY(p2.nearY,p2);for(var pi=0;pi<a.length;pi++){for(var i=0;i<LANE_COUNT;i++){if(a[pi].x>=info.lanes[i]&&a[pi].x<=info.lanes[i]+info.laneW){triggerLaneFlash(i);playTap();recordTap(i);break}}}return}handleTap(a)},{passive:false});
